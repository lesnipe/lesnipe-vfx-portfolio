<!DOCTYPE html>

<head>
  <meta charset="utf-8" />

  <title>Le Snipe Visuals · Links</title>

  <style>
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; min-height: 100dvh; background: radial-gradient(ellipse at top, #1d1208 0%, #0c0c0e 55%); color: #f9f9f9;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; justify-content: center; padding: 56px 16px 40px; }
    main { width: 100%; max-width: 420px; text-align: center; }
    img { width: 104px; height: 104px; border-radius: 50%; background: #000; border: 2px solid #ff7700; object-fit: cover; }
    h1 { font-size: 22px; font-weight: 700; margin-top: 16px; }
    p { color: #a8a8b0; font-size: 14px; margin-top: 6px; }
    nav { display: grid; gap: 14px; margin-top: 32px; }
    a { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 17px 20px; border-radius: 14px; font-size: 16px; font-weight: 600;
      color: #f9f9f9; text-decoration: none; background: #17171b; border: 1px solid #2a2a30; transition: transform .15s, border-color .15s, background .15s; }
    a:hover, a:focus-visible { border-color: #ff7700; transform: translateY(-2px); outline: none; }
    a:active { transform: scale(.98); }
    a.main { background: #ff7700; border-color: #ff7700; color: #140a00; }
    a.main:hover { background: #ff8a24; }
    footer { color: #5d5d66; font-size: 12px; margin-top: 40px; }
  </style>
</head>
